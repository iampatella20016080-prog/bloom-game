<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fb8">
  <title>綻放 BLOOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone" id="phone">
    <div class="notch" aria-hidden="true"></div>

    <header class="appbar">
      <div class="brand"><span class="brand-flower" id="brandFlower"></span>綻放 <b>BLOOM</b></div>
      <div class="appbar-right">
        <div class="day" id="day">產後第 1 天</div>
        <button class="sound-btn" id="soundBtn" type="button" aria-label="音效開關">🔊</button>
      </div>
    </header>

    <section class="stats" aria-label="數值">
      <div class="bmi-panel" data-stat="bmi">
        <div class="bmi-label">⚖️ 你的 BMI</div>
        <div class="bmi-value" id="bmiValue">--</div>
        <div class="bmi-target" id="bmiTarget"></div>
        <span class="dot"></span>
      </div>
      <div class="minor">
        <div class="stat" data-stat="mood"><span class="icon">🌙</span><span class="lbl">精神</span><div class="bar"><i></i></div><span class="dot"></span></div>
        <div class="stat" data-stat="baby"><span class="icon">👶</span><span class="lbl">寶寶</span><div class="bar"><i></i></div><span class="dot"></span></div>
        <div class="stat" data-stat="family"><span class="icon">💞</span><span class="lbl">家人</span><div class="bar"><i></i></div><span class="dot"></span></div>
      </div>
    </section>

    <main class="stage" id="stage">
      <div class="card-back" aria-hidden="true"></div>
      <div class="card" id="card" role="group" aria-live="polite"></div>
    </main>

    <div class="reply" id="reply" aria-live="polite"></div>
    <div class="push" id="push" role="alert"></div>

    <footer class="controls">
      <button type="button" id="btnLeft">← <span></span></button>
      <button type="button" id="btnRight"><span></span> →</button>
    </footer>

    <svg class="cracks" id="cracks" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>

    <div class="overlay" id="overlay"></div>
  </div>

  <script src="config.js"></script>
  <script src="cards.js"></script>
  <script src="game.js"></script>
</body>
</html>
